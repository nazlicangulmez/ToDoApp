<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yapılacaklar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="tema-btn" aria-label="Temayı değiştir" title="Temayı değiştir">
  <svg id="tema-ikon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"></circle>
    <line x1="12" y1="1.5" x2="12" y2="4"></line>
    <line x1="12" y1="20" x2="12" y2="22.5"></line>
    <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
    <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
    <line x1="1.5" y1="12" x2="4" y2="12"></line>
    <line x1="20" y1="12" x2="22.5" y2="12"></line>
    <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
    <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
  </svg>
</button>

<div id="giris-ekrani">
  <h1>Yapılacaklar</h1>
  <input type="email" id="eposta" placeholder="E-posta">
  <input type="password" id="sifre" placeholder="Şifre">
  <button id="giris-btn">Giriş Yap</button>
  <button id="kayit-btn" class="ikincil">Kayıt Ol</button>
  <p id="giris-mesaj"></p>
</div>

<div id="uygulama" style="display: none;">

  <header class="ust">
    <h1>Yapılacaklar</h1>
    <div class="giris-satiri">
      <input type="text" id="yeni-gorev" placeholder="Yeni görev yaz...">
      <button id="ekle-btn">Ekle</button>
    </div>
    <button id="cikis-btn" class="ikincil">Çıkış</button>
  </header>

  <main class="pano">
    <section class="kolon" data-durum="bekliyor">
      <div class="kolon-baslik">
        <span class="nokta nokta-bekliyor"></span>
        <h2>Bekliyor</h2>
        <span class="sayac" id="sayac-bekliyor">0</span>
      </div>
      <div class="kart-listesi" id="liste-bekliyor"></div>
    </section>

    <section class="kolon" data-durum="devam">
      <div class="kolon-baslik">
        <span class="nokta nokta-devam"></span>
        <h2>Devam Ediyor</h2>
        <span class="sayac" id="sayac-devam">0</span>
      </div>
      <div class="kart-listesi" id="liste-devam"></div>
    </section>

    <section class="kolon" data-durum="bitti">
      <div class="kolon-baslik">
        <span class="nokta nokta-bitti"></span>
        <h2>Tamamlandı</h2>
        <span class="sayac" id="sayac-bitti">0</span>
      </div>
      <div class="kart-listesi" id="liste-bitti"></div>
    </section>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
