<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yapılacaklar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="theme-btn" aria-label="Temayı değiştir" title="Temayı değiştir">
  <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"></circle>
    <line x1="12" y1="1.5" x2="12" y2="4"></line>
    <line x1="12" y1="20" x2="12" y2="22.5"></line>
    <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
    <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
    <line x1="1.5" y1="12" x2="4" y2="12"></line>
    <line x1="20" y1="12" x2="22.5" y2="12"></line>
    <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
    <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
  </svg>
</button>

<div id="login-screen">
  <h1>Yapılacaklar</h1>
  <input type="email" id="email" placeholder="E-posta">
  <input type="password" id="password" placeholder="Şifre">
  <button id="login-btn">Giriş Yap</button>
  <button id="register-btn" class="secondary">Kayıt Ol</button>
  <p id="login-message"></p>
</div>

<div id="app" style="display: none;">

  <header class="header">
    <h1>Yapılacaklar</h1>
    <div class="input-row">
      <input type="text" id="new-todo" placeholder="Yeni görev yaz...">
      <button id="add-btn">Ekle</button>
    </div>
    <button id="logout-btn" class="secondary">Çıkış</button>
  </header>

  <main class="board">
    <section class="column" data-status="pending">
      <div class="column-title">
        <span class="dot dot-pending"></span>
        <h2>Bekliyor</h2>
        <span class="count" id="count-pending">0</span>
      </div>
      <div class="card-list" id="list-pending"></div>
    </section>

    <section class="column" data-status="in_progress">
      <div class="column-title">
        <span class="dot dot-in-progress"></span>
        <h2>Devam Ediyor</h2>
        <span class="count" id="count-in-progress">0</span>
      </div>
      <div class="card-list" id="list-in-progress"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-title">
        <span class="dot dot-done"></span>
        <h2>Tamamlandı</h2>
        <span class="count" id="count-done">0</span>
      </div>
      <div class="card-list" id="list-done"></div>
    </section>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
